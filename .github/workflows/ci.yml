name: CI

on:
  push:
    branches: [ main, 'ci/**' ]
  pull_request:
    branches: [ main ]

# el CI solo lee el repositorio
permissions:
  contents: read

jobs:
  test:
    name: vet + test -race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...

  cross-build:
    name: build darwin/linux/windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: GOOS build
        run: for os in darwin linux windows; do GOOS=$os go build ./... ; done

  lint-vuln:
    name: golangci-lint + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  docker-build:
    name: docker build (not published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Dockerfile
        run: docker build -t lazymark-mcp:ci .
      - name: Smoke test the MCP server in the image
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          reply="$(printf '%s\n' "$request" | timeout 30 docker run -i --rm --name lazymark-smoke lazymark-mcp:ci)"
          echo "$reply"
          echo "$reply" | grep -q '"serverInfo"'
      - name: Remove the smoke container
        if: always()
        run: docker rm -f lazymark-smoke || true

  release-dry-run:
    name: release dry run (snapshot, not published)
    # Only on the disposable ci/** branches that ci-push.sh creates: exercises release.yml's steps without a tag.
    if: startsWith(github.ref, 'refs/heads/ci/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Release notes from CHANGELOG.md (newest released section)
        run: |
          version="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')"
          scripts/release-notes.sh "$version" > "$RUNNER_TEMP/release-notes.md"
          echo "Notes for $version:"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2 # keep equal to release.yml
          args: release --snapshot --clean --skip=publish --release-notes ${{ runner.temp }}/release-notes.md
        env:
          # not a secret: the cask template reads the variable, but nothing is published
          HOMEBREW_TAP_GITHUB_TOKEN: dry-run
      - name: List the artifacts
        run: ls -1 dist | grep -E '\.(tar\.gz|zip)$|checksums' | sort
