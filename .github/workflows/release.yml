name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
      id-token: write # sigstore certificate for the attestation
      attestations: write # store the attestation
      artifact-metadata: write # artifact storage record (required by actions/attest)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        # fails if CHANGELOG.md has no section for this version
        run: scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2 # exacta (la de la release v0.7.0): un "~> v2" tomaría una versión nueva sin que nadie la revise
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Rewrite the cask hook to postflight_steps
        # GoReleaser v2.18 writes the deprecated `postflight do` into the tap cask (Homebrew 7 warns on every
        # upgrade). Remove this step once a GoReleaser >= v2.19 is pinned with hooks.post.install_steps.
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git_tap() { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"; }
          git_tap clone --depth 1 https://github.com/MathiasDrizzy/homebrew-tap.git "$RUNNER_TEMP/tap"
          scripts/cask-postflight-steps.sh "$RUNNER_TEMP/tap/Casks/lazymark.rb"
          if grep -q 'postflight do' "$RUNNER_TEMP/tap/Casks/lazymark.rb"; then
            echo "the cask still has postflight do" >&2
            exit 1
          fi
          cd "$RUNNER_TEMP/tap"
          if git diff --quiet; then
            echo "cask already uses postflight_steps"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "fix(cask): use postflight_steps for lazymark ${GITHUB_REF_NAME}"
            git_tap push origin HEAD:main
          fi
      - name: Build provenance for the archives and the SBOMs
        # checksums.txt lists every archive and SBOM that GoReleaser published, so one attestation covers them all
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
