# GoReleaser v2. Docs: https://goreleaser.com/customization/homebrew_casks/
# `brews` está deprecado; el cask es el camino vigente para binarios precompilados.
version: 2

project_name: lazymark

builds:
  - id: lazymark
    main: ./cmd/lazymark
    binary: lazymark
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/MathiasDrizzy/lazymark/internal/config.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

homebrew_casks:
  - name: lazymark
    repository:
      owner: MathiasDrizzy
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/MathiasDrizzy/lazymark"
    description: "Terminal Markdown notes and task manager"
    binaries:
      - lazymark
    # El binario no está firmado ni notarizado: quita la cuarentena de macOS.
    # Homebrew 7 avisa "postflight is deprecated! Use postflight_steps instead" por este hook.
    # GoReleaser aún no genera `postflight_steps`: la opción `hooks.post.install_steps` está en el
    # PR https://github.com/goreleaser/goreleaser/pull/6873 (abierto; issue #6870, hito v2.19.0) y ni
    # v2.18.2 ni el nightly 2.19.0 la reconocen (`goreleaser check`: "field install_steps not found").
    # Cuando salga, cambiar `install` por `install_steps` con `on_macos do run "/usr/bin/xattr", args:
    # ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lazymark"] end`.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazymark"]
          end

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "Merge pull request"
